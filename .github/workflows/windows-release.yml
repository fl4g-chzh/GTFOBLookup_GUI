name: Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Package Windows installer
        run: npm run pack:win

      - name: Compress unpacked app
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/GTFOBLookup-win-unpacked.zip -Force

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTFOBLookup-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/*.zip
          generate_release_notes: true
